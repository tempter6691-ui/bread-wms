<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>브레드뱅크 발주 관리</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --primary:#7ba7c9;--accent:#e8c5a0;--bg:#faf7f2;--white:#fff;
  --success:#8fd0a8;--warning:#f5c876;--danger:#f0a5a0;--border:#e5e0da;--sub:#9a9a9a;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:#4a4a4a;min-height:100vh;}

.header{background:var(--primary);color:#fff;padding:.9rem 1rem;display:flex;align-items:center;gap:.6rem;position:sticky;top:0;z-index:100;}
.header-title-wrap{flex:1;min-width:0;}
.header-btns{display:flex;align-items:center;}
.header h1{font-size:.95rem;font-weight:700;flex:1;}
.header-sub{font-size:.72rem;color:var(--accent);}
.refresh-btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:.45rem .8rem;font-size:.78rem;cursor:pointer;font-family:inherit;font-weight:700;}

/* 통계 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;padding:.7rem;}
.stat{background:#fff;border-radius:8px;padding:.6rem;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.stat-num{font-size:1.3rem;font-weight:700;color:var(--primary);}
.stat-label{font-size:.68rem;color:var(--sub);margin-top:1px;}

/* 필터/검색 */
.toolbar{background:#fff;padding:.6rem .8rem;border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:90;}
.search-row{display:flex;gap:.5rem;margin-bottom:.5rem;}
.search-input{flex:1;padding:.55rem .8rem;border:1px solid var(--border);border-radius:6px;font-size:.82rem;font-family:inherit;}
.search-input:focus{outline:none;border-color:var(--primary);}
.filter-row{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:2px;}
.filter-row::-webkit-scrollbar{height:3px;}
.filter-row::-webkit-scrollbar-thumb{background:var(--accent);}
.fbtn{padding:.3rem .7rem;border-radius:16px;border:1px solid var(--border);background:#fff;font-size:.74rem;cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s;}
.fbtn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.fbtn.yellow.active{background:var(--warning);border-color:var(--warning);}
.fbtn.green.active{background:var(--success);border-color:var(--success);}
.fbtn.red.active{background:var(--danger);border-color:var(--danger);}

/* 날짜 그룹 */
.date-group{margin:.6rem .7rem 0;}
.date-header{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;background:#fff;color:#555;border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;user-select:none;}
.date-header-title{flex:1;font-size:.88rem;font-weight:700;}
.date-header-count{font-size:.75rem;color:var(--sub);}
.date-header-arrow{font-size:.8rem;transition:.2s;color:#999;}
.date-header.collapsed .date-header-arrow{transform:rotate(-90deg);}
.date-body{background:#f8f5f0;border:1px solid #ddd;border-top:none;border-radius:0 0 8px 8px;overflow:hidden;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background-color:#ddd;}
.date-body.hidden{display:none;}
.order-card{background:#fff;}

/* 발주 카드 */
.order-card{border-bottom:1px solid #f0f0f0;padding:.7rem .8rem;}
.order-card:last-child{border:none;}
.order-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;}
.order-client{font-weight:700;font-size:.88rem;flex:1;}
.order-time{font-size:.72rem;color:var(--sub);}
.order-driver{font-size:.7rem;padding:.15rem .5rem;border-radius:10px;background:#e8f0ff;color:var(--primary);font-weight:500;}
.status-badge{padding:.2rem .55rem;border-radius:10px;font-size:.68rem;font-weight:700;}
.status-pending{background:#fdf1dc;color:#a17b3f;}
.status-confirmed{background:#e2f3e7;color:#4a8b62;}
.status-cancelled{background:#fbe8e6;color:#b06b66;}

/* 아이템 토글 */
.items-toggle{font-size:.75rem;color:var(--primary);cursor:pointer;text-decoration:underline;margin-bottom:.3rem;display:inline-block;}
.items-body{display:none;}
.items-body.show{display:block;}
.item-row{display:flex;justify-content:space-between;font-size:.78rem;padding:.15rem 0;border-bottom:1px solid #f8f8f8;}
.item-row:last-child{border:none;}
.item-qty{font-weight:700;color:var(--primary);}

.order-memo{font-size:.72rem;color:var(--sub);font-style:italic;margin:.2rem 0;}

/* 답글 영역 */
.reply-box{background:#eef5fa;border:1px solid #dceaf5;border-radius:8px;padding:.5rem .6rem;margin-top:.4rem;}
.reply-shown{font-size:.75rem;color:#5a90a8;font-weight:600;display:flex;justify-content:space-between;align-items:flex-start;gap:.4rem;}
.reply-shown-text{flex:1;}
.reply-tag-badge{display:inline-block;background:#8fb8d4;color:#fff;font-size:.66rem;padding:1px 6px;border-radius:8px;font-weight:700;margin-right:.3rem;vertical-align:middle;}
.reply-edit-link{font-size:.68rem;color:#888;cursor:pointer;text-decoration:underline;white-space:nowrap;}
.reply-tags{display:flex;gap:.3rem;margin-bottom:.35rem;flex-wrap:wrap;}
.reply-tag-btn{padding:.25rem .55rem;border:1px solid #dceaf5;background:#fff;color:#8fb8d4;border-radius:12px;font-size:.7rem;cursor:pointer;font-family:inherit;font-weight:600;}
.reply-tag-btn:hover{background:#f0f6fa;}
.reply-input-row{display:flex;gap:.3rem;}
.reply-input{flex:1;padding:.35rem .5rem;border:1px solid #dceaf5;border-radius:5px;font-size:.75rem;font-family:inherit;}
.btn-reply-save{background:#8fb8d4;}

.order-actions{display:flex;gap:.4rem;margin-top:.4rem;}
.btn-sm{padding:.35rem .7rem;border:none;border-radius:5px;font-size:.72rem;cursor:pointer;font-family:inherit;font-weight:700;color:#fff;}
.btn-confirm{background:var(--success);}
.btn-cancel{background:var(--danger);}
.btn-print{background:var(--primary);}

.status-exported{background:#f0e3f5;color:#a67cb8;}
.new-dot{display:inline-block;width:7px;height:7px;background:var(--danger);border-radius:50%;margin-left:4px;vertical-align:middle;}

@keyframes bellBlink { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.3;transform:scale(1.15);} }
.bell-blink{display:inline-block;animation:bellBlink .9s infinite;margin-left:.35rem;font-size:.85rem;}

/* 요청사항(거래처 댓글) */
.req-client-row{padding:.55rem .7rem;border:1px solid var(--border);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:#fff;}
.req-client-row:hover{background:#f5f9fc;}
.req-client-name{font-weight:700;font-size:.82rem;}
.req-client-preview{font-size:.72rem;color:var(--sub);margin-top:2px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.req-count-badge{background:var(--danger);color:#fff;font-size:.68rem;font-weight:700;border-radius:10px;padding:1px 7px;}
.req-msg-row{display:flex;margin-bottom:.4rem;}
.req-msg-bubble{max-width:78%;padding:.5rem .75rem;border-radius:12px;font-size:.8rem;line-height:1.5;word-break:break-word;}

/* ── 모바일 화면 대응 ── */
@media (max-width: 640px) {
  .header{flex-direction:column;align-items:stretch;row-gap:.5rem;padding:.7rem .9rem;}
  .header h1{white-space:nowrap;word-break:keep-all;font-size:.9rem;}
  .header-sub{white-space:nowrap;word-break:keep-all;}
  .header-btns{gap:.4rem;}
  .header-btns .refresh-btn{flex:1 1 0;text-align:center;white-space:nowrap;padding:.4rem .3rem;font-size:.68rem;margin-right:0!important;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .date-body{grid-template-columns:1fr;}
  .order-actions{flex-wrap:wrap;row-gap:.35rem;}
  .order-actions input[type="date"]{flex:1 1 auto;min-width:0;}
  .order-actions .btn-sm{white-space:nowrap;}
}

  </div>

<div id="request-thread-modal" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:16px 16px 0 0;padding:1rem;z-index:501;max-height:80vh;overflow-y:auto;">
  <div style="font-weight:700;margin-bottom:.6rem;color:var(--primary);" id="request-thread-title"></div>

<div class="stats">

  <div class="stat"><div class="stat-num" id="s-pending" style="color:var(--warning);">-</div><div class="stat-label">대기중</div></div>

<div class="toolbar">

    <button class="fbtn red" onclick="setStatus('cancelled',this)">❌ 취소</button>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAI5VBBXB2dUS5kk5IE--xfCe_C2r0PrIA",

  projectId:"bread-wms",

const db = firebase.firestore();

// ===== 공지사항 관리 =====
function toggleNoticeEditor(){
  var p = document.getElementById('notice-panel');
  var show = p.style.display === 'none';
  p.style.display = show ? 'block' : 'none';
  if (show) loadNotice();
}
async function loadNotice(){
  try {
    var doc = await db.collection('settings').doc('notice').get();
    var d = doc.exists ? (doc.data()||{}) : {};
    document.getElementById('notice-text').value = d.text || '';
    document.getElementById('notice-active').checked = !!d.active;
    document.getElementById('notice-saved-at').textContent = d.updatedAt ? ('마지막 저장: ' + d.updatedAt.toDate().toLocaleString('ko-KR')) : '';
  } catch(e) { alert('공지사항 로드 실패: ' + e.message); }
}
async function saveNotice(){
  var text = document.getElementById('notice-text').value;
  var active = document.getElementById('notice-active').checked;
  try {
    await db.collection('settings').doc('notice').set({
      text: text, active: active, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    alert('공지사항이 저장됐어요.');
    loadNotice();
  } catch(e) { alert('저장 실패: ' + e.message); }
}

let allOrders = [];
let clients = {}; // name -> driver
let statusFilter = 'all';
let prodCatMap = {}; // pid -> cat (품목 그룹핑용, 최초 1회 로드 후 캐시)
let prodUnitMap = {}; // pid -> unit (제품관리 화면의 실제 단위 — 발주앱에서 넘어온 값은 신뢰하지 않고 항상 이걸로 덮어씀)
async function loadProdCatMap() {
  if (Object.keys(prodCatMap).length) return prodCatMap;
  try {
    var snap = await db.collection('products').get();
    snap.forEach(function(doc){
      var d = doc.data()||{};
      prodCatMap[doc.id] = d.cat || '';
      prodUnitMap[doc.id] = d.unit || '';
    });
  } catch(e) { console.error('제품 분류 로드 실패:', e.message); }
  return prodCatMap;
}
// 출고지시서와 동일한 키워드 그룹핑 기준 (이름에 이 단어가 들어가면 분류가 달라도 서로 붙어서 표시됨)
var ORD_GROUP_KEYWORDS = ['사각'];
// 같은 분류(cat) 또는 같은 키워드 품목끼리 묶이도록 정렬 (분류/키워드 없는 품목은 원래 순서 유지하며 맨 뒤로)
function groupItemsByCat(items) {
  var groupOrder = [], seen = {};
  items.forEach(function(it){
    var pname = it.pname || '';
    var kw = ORD_GROUP_KEYWORDS.find(function(k){return pname.indexOf(k)>=0;});
    var key = kw ? ('kw:'+kw) : (prodCatMap[it.pid] ? ('cat:'+prodCatMap[it.pid]) : '');
    if (key && !seen[key]) { seen[key] = true; groupOrder.push(key); }
  });
  var buckets = {}, noGroup = [];
  groupOrder.forEach(function(k){ buckets[k] = []; });
  items.forEach(function(it){
    var pname = it.pname || '';
    var kw = ORD_GROUP_KEYWORDS.find(function(k){return pname.indexOf(k)>=0;});
    var key = kw ? ('kw:'+kw) : (prodCatMap[it.pid] ? ('cat:'+prodCatMap[it.pid]) : '');
    if (key) buckets[key].push(it); else noGroup.push(it);
  });
  var result = [];
  groupOrder.forEach(function(k){ result = result.concat(buckets[k]); });
  return result.concat(noGroup);
}

function escapeHtml(str) {
  return String(str==null?'':str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ===== 거래처명 유사도 자동 매핑 =====
// 거래처명에서 "(수원)" 같은 지점/지역 괄호 표기와 공백을 제거해서 핵심 이름만 비교
function normalizeClientName(s) {
  return String(s||'').trim().replace(/\([^)]*\)/g,'').replace(/\s+/g,'');
}

// 레벤슈타인 거리 (편집거리)
function levenshtein(a, b) {
  var m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  var dp = new Array(n+1);
  for (var j=0;j<=n;j++) dp[j]=j;
  for (var i=1;i<=m;i++) {
    var prev = dp[0];
    dp[0] = i;
    for (var j=1;j<=n;j++) {
      var temp = dp[j];
      dp[j] = Math.min(dp[j]+1, dp[j-1]+1, prev + (a[i-1]===b[j-1]?0:1));
      prev = temp;
    }
  }
  return dp[n];
}

// 두 거래처명의 유사도 (0~1, 1이 완전히 같음). 지점/지역 괄호 표기는 무시하고 비교.
function nameSimilarity(a, b) {
  var na = normalizeClientName(a), nb = normalizeClientName(b);
  if (!na.length && !nb.length) return 1;
  var dist = levenshtein(na, nb);
  var maxLen = Math.max(na.length, nb.length);
  return maxLen===0 ? 1 : 1 - dist/maxLen;
}

var AUTO_MAP_THRESHOLD = 0.9; // 90% 이상 유사하면 자동 매핑

// 등록된 거래처(clients) 중 가장 비슷한 이름 찾기
function findBestClientMatch(orderClientName) {
  var bestName = null, bestScore = 0;
  Object.keys(clients).forEach(function(regName){
    var score = nameSimilarity(orderClientName, regName);
    if (score > bestScore) { bestScore = score; bestName = regName; }
  });
  return { name: bestName, score: bestScore };
}

// 주문에 찍힌 거래처명을 실제 등록 거래처명으로 해석.
// 1순위: 정확히 일치 → 그대로
// 2순위: 거래처에 등록된 별칭(aliases)과 정확히 일치 → 그 거래처로 매핑 (유사도 계산 없이 확정)
// 3순위: 90%+ 유사한 이름이 있으면 자동 매핑, 없으면 null.
function resolveClientName(orderClientName) {
  if (orderClientName in clients) return { name: orderClientName, autoMapped: false };
  if (orderClientName in clientAliases) return { name: clientAliases[orderClientName], autoMapped: true, aliasMapped: true };
  var m = findBestClientMatch(orderClientName);
  if (m.name && m.score >= AUTO_MAP_THRESHOLD) return { name: m.name, autoMapped: true, score: m.score };
  return { name: null, autoMapped: false };
}

// 거래처 목록 로드
var clientAliases = {}; // 별칭명 -> 정식 거래처명
async function loadClients() {
  try {
    var snap = await db.collection('clients').get();
    clientAliases = {};
    snap.forEach(function(d){
      var data = d.data();
      if(data.name) clients[data.name] = data.driver || '';
      (data.aliases||[]).forEach(function(alias){
        if(alias && data.name) clientAliases[alias] = data.name;
      });
    });
  } catch(e) {}
}

// ===== 요청사항 (거래처 ↔ 더브레드뱅크 댓글) =====
var _requestClientsCache = [];
var _curThreadClient = null;

async function toggleRequestPanel(){
  var p = document.getElementById('request-panel');
  var show = p.style.display === 'none';
  p.style.display = show ? 'block' : 'none';
  if (show) await loadRequestClients();
}

async function loadRequestClients(){
  var el = document.getElementById('request-client-list');
  el.innerHTML = '로딩 중...';
  try {
    var snap = await db.collection('client_messages').get();
    var byClient = {};
    snap.forEach(function(d){
      var m = d.data();
      if(!byClient[m.client]) byClient[m.client] = {client:m.client, lastTs:0, lastText:'', unread:0};
      var ts = m.ts && m.ts.toDate ? m.ts.toDate().getTime() : 0;
      if(ts >= byClient[m.client].lastTs){ byClient[m.client].lastTs = ts; byClient[m.client].lastText = m.text; }
      if(m.from === 'client' && m.readByAdmin === false) byClient[m.client].unread++;
    });
    var list = Object.values(byClient).sort(function(a,b){ return b.lastTs - a.lastTs; });
    _requestClientsCache = list;
    if(!list.length){ el.innerHTML = '<div style="color:#aaa;font-size:.8rem;padding:.5rem;">아직 요청사항이 없어요</div>'; return; }
    el.innerHTML = list.map(function(c, i){
      return '<div class="req-client-row" onclick="openRequestThread('+i+')">'+
        '<div><div class="req-client-name">'+escapeHtml(c.client)+'</div>'+
        '<div class="req-client-preview">'+escapeHtml(c.lastText||'')+'</div></div>'+
        (c.unread>0 ? '<span class="bell-blink">🔔'+c.unread+'</span>' : '')+
      '</div>';
    }).join('');
  } catch(e) {
    el.innerHTML = '<p style="color:red;font-size:.8rem;">오류: '+e.message+'</p>';
  }
}

async function openRequestThread(i){
  var c = _requestClientsCache[i];
  if(!c) return;
  _curThreadClient = c.client;
  document.getElementById('request-thread-title').textContent = '💬 ' + c.client;
  document.getElementById('request-thread-overlay').style.display = 'block';
  document.getElementById('request-thread-modal').style.display = 'block';
  await loadRequestThread();
}
function closeRequestThread(){
  document.getElementById('request-thread-overlay').style.display = 'none';
  document.getElementById('request-thread-modal').style.display = 'none';
  loadRequestClients(); // 목록 배지 갱신
}
async function loadRequestThread(){
  var el = document.getElementById('request-thread-msgs');
  el.innerHTML = '로딩 중...';
  try {
    var snap = await db.collection('client_messages').where('client','==',_curThreadClient).get();
    var msgs = []; snap.forEach(function(d){ msgs.push(Object.assign({id:d.id}, d.data())); });
    msgs.sort(function(a,b){
      var ta=a.ts&&a.ts.toDate?a.ts.toDate().getTime():0, tb=b.ts&&b.ts.toDate?b.ts.toDate().getTime():0;
      return ta-tb;
    });
    el.innerHTML = msgs.map(function(m){
      var mine = m.from === 'admin'; // 관리자 입장에서 내가 보낸 메시지는 오른쪽
      var t = m.ts && m.ts.toDate ? m.ts.toDate() : null;
      var timeStr = t ? ((t.getMonth()+1)+'/'+t.getDate()+' '+t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0')) : '';
      return '<div class="req-msg-row" style="justify-content:'+(mine?'flex-end':'flex-start')+';">'+
        '<div><div class="req-msg-bubble" style="background:'+(mine?'#7ba7c9;color:#fff':'#eee;color:#333')+';">'+escapeHtml(m.text)+'</div>'+
        '<div style="font-size:.65rem;color:var(--sub);margin-top:2px;text-align:'+(mine?'right':'left')+';">'+(mine?'':escapeHtml(_curThreadClient)+' · ')+timeStr+'</div></div>'+
      '</div>';
    }).join('');
    el.scrollTop = el.scrollHeight;
    // 거래처가 보낸 메시지 읽음 처리
    var batch = db.batch(); var any = false;
    snap.forEach(function(d){
      var m = d.data();
      if(m.from === 'client' && m.readByAdmin === false){ batch.update(d.ref, {readByAdmin:true}); any = true; }
    });
    if(any) await batch.commit();
  } catch(e) {
    el.innerHTML = '<p style="color:red;font-size:.8rem;">오류: '+e.message+'</p>';
  }
}
async function sendAdminReply(){
  var inp = document.getElementById('request-thread-input');
  var text = inp.value.trim();
  if(!text || !_curThreadClient) return;
  inp.value = '';
  try {
    await db.collection('client_messages').add({
      client: _curThreadClient, from: 'admin', text: text,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
      readByAdmin: true, readByClient: false
    });
    loadRequestThread();
  } catch(e) { alert('전송 오류: '+e.message); }
}

async function loadOrders() {
  document.getElementById('orders-wrap').innerHTML = '<div class="empty">로딩 중...</div>';
  try {
    await loadClients();
    var snap = await db.collection('orders_request').orderBy('ts','desc').get();
    allOrders = [];
    snap.forEach(function(d){ allOrders.push(Object.assign({id:d.id}, d.data())); });
    updateStats();
    renderOrders();

    // 헤더 업데이트
    var now = new Date();
    document.getElementById('header-sub').textContent =
      '마지막 업데이트: ' + now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  } catch(e) {
    document.getElementById('orders-wrap').innerHTML = '<div class="empty" style="color:red;">오류: '+e.message+'</div>';
  }
}

function updateStats() {
  var today = new Date(); today.setHours(0,0,0,0);
  document.getElementById('s-total').textContent = allOrders.length;
  document.getElementById('s-pending').textContent = allOrders.filter(function(o){return o.status==='pending';}).length;
  document.getElementById('s-confirmed').textContent = allOrders.filter(function(o){return o.status==='confirmed';}).length;
  document.getElementById('s-today').textContent = allOrders.filter(function(o){
    var t = o.ts&&o.ts.toDate?o.ts.toDate():null;
    return t && t >= today;
  }).length;
}

function setStatus(s, btn) {
  statusFilter = s;
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderOrders();
}

function applyFilter() { renderOrders(); }

function renderOrders() {
  var keyword = (document.getElementById('search').value||'').trim();
  var list = allOrders.filter(function(o){
    if(statusFilter !== 'all' && o.status !== statusFilter) return false;
    if(keyword && !(o.client||'').includes(keyword)) return false;
    return true;
  });

  if(!list.length){
    document.getElementById('orders-wrap').innerHTML = '<div class="empty">발주가 없어요</div>';
    return;
  }

  // 날짜별 그룹핑
  var groups = {};
  list.forEach(function(o){
    var t = o.ts&&o.ts.toDate?o.ts.toDate():new Date();
    var dateStr = t.getFullYear()+'-'+(t.getMonth()+1).toString().padStart(2,'0')+'-'+t.getDate().toString().padStart(2,'0');
    // 오늘/어제 라벨
    var today = new Date(); today.setHours(0,0,0,0);
    var yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
    var d = new Date(t); d.setHours(0,0,0,0);
    var label = d.getTime()===today.getTime()?'📅 오늘 ('+dateStr+')':
                d.getTime()===yesterday.getTime()?'📅 어제 ('+dateStr+')':
                '📅 '+dateStr;
    if(!groups[dateStr]) groups[dateStr] = {label:label, orders:[]};
    groups[dateStr].orders.push(o);
  });

  var html = '';
  Object.keys(groups).sort(function(a,b){return b.localeCompare(a);}).forEach(function(dateStr){
    var g = groups[dateStr];
    var pendingCnt = g.orders.filter(function(o){return o.status==='pending';}).length;
    html += '<div class="date-group">'+
      '<div class="date-header" onclick="toggleDate(this)">'+
        '<div class="date-header-title">'+g.label+(pendingCnt>0?'<span class="new-dot"></span>':'')+' </div>'+
        '<div class="date-header-count">'+g.orders.length+'건'+(pendingCnt>0?' · 대기 '+pendingCnt+'건':'')+'</div>'+
        '<span class="date-header-arrow">▼</span>'+
      '</div>'+
      '<div class="date-body">'+
        g.orders.map(function(o){ return renderCard(o); }).join('')+
      '</div>'+
    '</div>';
  });

  document.getElementById('orders-wrap').innerHTML = html + '<div style="height:1rem;"></div>';
}

function toggleDate(el) {
  el.classList.toggle('collapsed');
  el.nextElementSibling.classList.toggle('hidden');
}

function toggleItems(el) {
  var body = el.nextElementSibling;
  if(body.classList.contains('show')){
    body.classList.remove('show');
    el.textContent = '▶ 품목 보기';
  } else {
    body.classList.add('show');
    el.textContent = '▼ 품목 접기';
  }
}

function renderCard(o) {
  var t = o.ts&&o.ts.toDate?o.ts.toDate():new Date();
  var timeStr = t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
  var isNew = (new Date()-t) < 3600000;
  var resolved = resolveClientName(o.client); // {name, autoMapped, score} 또는 {name:null}
  var isUnknownClient = !resolved.name; // 정말 매칭되는 거래처가 없을 때만 경고
  var isAutoMapped = !!resolved.autoMapped;
  var driver = resolved.name ? (clients[resolved.name] || '') : '';
  var statusLabel = o.status==='pending'?'⏳ 대기':o.status==='confirmed'?'✅ 완료':o.status==='exported'?'📋 등록됨':'❌ 취소';
  var statusClass = 'status-'+(o.status==='exported'?'exported':o.status);
  var total = (o.items||[]).reduce(function(s,i){return s+i.qty;},0);
  var items = o.items||[];

  // 2열로 나누기
  var half = Math.ceil(items.length/2);
  var left = items.slice(0,half);
  var right = items.slice(half);

  var itemsHtml = '<table style="width:100%;border-collapse:collapse;font-size:.78rem;margin-top:.3rem;">'+
    '<thead><tr>'+
      '<th style="text-align:left;padding:2px 4px;border-bottom:1px solid #eee;color:#888;font-weight:500;">품목</th>'+
      '<th style="text-align:center;padding:2px 4px;border-bottom:1px solid #eee;color:#888;font-weight:500;width:30px;">수량</th>'+
      '<th style="text-align:left;padding:2px 4px 2px 12px;border-bottom:1px solid #eee;color:#888;font-weight:500;">품목</th>'+
      '<th style="text-align:center;padding:2px 4px;border-bottom:1px solid #eee;color:#888;font-weight:500;width:30px;">수량</th>'+
    '</tr></thead><tbody>';

  for(var i=0;i<left.length;i++){
    var r=right[i];
    itemsHtml+='<tr>'+
      '<td style="padding:2px 4px;border-bottom:1px solid #f8f8f8;">'+escapeHtml(left[i].pname)+'</td>'+
      '<td style="padding:2px 4px;text-align:center;font-weight:700;color:#1e3a5f;border-bottom:1px solid #f8f8f8;">'+left[i].qty+'</td>'+
      '<td style="padding:2px 4px 2px 12px;border-bottom:1px solid #f8f8f8;">'+(r?escapeHtml(r.pname):'')+'</td>'+
      '<td style="padding:2px 4px;text-align:center;font-weight:700;color:#1e3a5f;border-bottom:1px solid #f8f8f8;">'+(r?r.qty:'')+'</td>'+
    '</tr>';
  }
  itemsHtml+='</tbody></table>';

  return '<div class="order-card" id="ocard_'+o.id+'">'+
    '<div class="order-top">'+
      '<div class="order-client">'+escapeHtml(o.client)+(isNew&&o.status==='pending'?'<span class="new-dot"></span>':'')+
      '</div>'+
      (o.memo?'<span style="background:#f0a5a0;color:#fff;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:5px;">💬 '+escapeHtml(o.memo)+'</span>':'')+
      (isUnknownClient?'<span style="background:#f0a5a0;color:#fff;font-size:.68rem;padding:1px 6px;border-radius:4px;font-weight:700;">⚠️ 미등록 거래처</span>':'')+
      (isAutoMapped?'<span style="background:#8fb8d4;color:#fff;font-size:.68rem;padding:1px 6px;border-radius:4px;font-weight:700;">🔗 '+escapeHtml(resolved.name)+'로 자동연동</span>':'')+
      (driver?'<span class="order-driver">'+escapeHtml(driver)+'</span>':'')+
      '<span class="order-time">'+timeStr+'</span>'+
      '<span class="status-badge '+statusClass+'">'+statusLabel+'</span>'+
    '</div>'+
    '<span class="items-toggle" onclick="toggleItems(this)">▶ 품목 보기 ('+(o.items||[]).length+'개 품목, '+total+'개)</span>'+
    '<div class="items-body">'+
      itemsHtml+
      (isUnknownClient?'<div style="background:#fdf1dc;color:#a17b3f;padding:6px 10px;border-radius:6px;font-size:.78rem;margin-top:.4rem;">⚠️ "'+escapeHtml(o.client)+'"은 거래처 관리에 등록되지 않은 이름입니다. 정식 거래처명과 다르면 출고지시서에 중복 거래처가 생성될 수 있습니다. 등록 후 처리해 주세요.</div>':'')+
      (isAutoMapped?'<div style="background:#f0f6fa;color:#5a90a8;padding:6px 10px;border-radius:6px;font-size:.78rem;margin-top:.4rem;">🔗 "'+escapeHtml(o.client)+'"을 등록된 거래처 "'+escapeHtml(resolved.name)+'"로 자동 연동했어요 (유사도 '+Math.round(resolved.score*100)+'%). 다른 거래처라면 거래처 관리에서 별도 등록해 주세요.</div>':'')+
      buildReplyBox(o)+
    '</div>'+
    '<div class="order-actions">'+
      (o.status==='pending'?
        '<button class="btn-sm btn-confirm" onclick="confirmOrder(\''+o.id+'\')">✅ 확인</button>'+
        '<button class="btn-sm btn-cancel" onclick="cancelOrder(\''+o.id+'\')">❌ 취소</button>':'')+
      (o.status==='confirmed'||o.status==='exported'?
        '<span style="font-size:.68rem;color:var(--sub);margin-right:.2rem;">배송일</span>'+
        '<input type="date" id="edate_'+o.id+'" value="'+(o.exportDate||(t.getFullYear()+'-'+(t.getMonth()+1).toString().padStart(2,'0')+'-'+t.getDate().toString().padStart(2,'0')))+'" style="padding:.3rem .4rem;border:1px solid var(--border);border-radius:5px;font-size:.72rem;font-family:inherit;margin-right:.3rem;" onchange="updateExportDate(\''+o.id+'\',this.value)">'+
        '<button class="btn-sm" style="background:#8e44ad;" onclick="exportToOrder(\''+o.id+'\')">📋 출고지시서 '+(o.status==='exported'?'재등록':'등록')+'</button>':'')+
      '<button class="btn-sm btn-print" onclick="printOrder(\''+o.id+'\')">🖨️ 출력</button>'+
    '</div>'+
  '</div>';
}

var REPLY_TAGS = ['확인접수','처리완료','전달함'];

function buildReplyBox(o) {
  var hasReply = !!(o.reply || o.replyTag);
  var editing = window._replyEditing === o.id;

  if (hasReply && !editing) {
    // 답글이 이미 있고, 수정 모드가 아니면 -> 보여주기만
    return '<div class="reply-box">'+
      '<div class="reply-shown">'+
        '<div class="reply-shown-text">'+
          (o.replyTag?'<span class="reply-tag-badge">'+escapeHtml(o.replyTag)+'</span>':'')+
          (o.reply?escapeHtml(o.reply):'')+
        '</div>'+
        '<span class="reply-edit-link" onclick="toggleReplyEdit(\''+o.id+'\')">수정</span>'+
      '</div>'+
    '</div>';
  }

  // 답글이 없거나, 수정 모드 -> 입력 UI
  var curVal = editing ? (o.reply||'') : '';
  return '<div class="reply-box">'+
    '<div class="reply-tags">'+
      REPLY_TAGS.map(function(tag){
        return '<button class="reply-tag-btn" onclick="setReplyTag(\''+o.id+'\',\''+tag+'\')">'+tag+'</button>';
      }).join('')+
    '</div>'+
    '<div class="reply-input-row">'+
      '<input class="reply-input" id="reply-input-'+o.id+'" placeholder="거래처에 보낼 답글을 입력하세요" value="'+escapeHtml(curVal)+'">'+
      '<button class="btn-sm btn-reply-save" onclick="saveReply(\''+o.id+'\')">저장</button>'+
    '</div>'+
  '</div>';
}

function toggleReplyEdit(id) {
  window._replyEditing = (window._replyEditing === id) ? null : id;
  refreshOrderCard(id);
}

async function setReplyTag(id, tag) {
  var o = allOrders.find(function(x){return x.id===id;}); if(!o) return;
  try {
    await db.collection('orders_request').doc(id).update({
      replyTag: tag,
      replyTs: firebase.firestore.FieldValue.serverTimestamp()
    });
    o.replyTag = tag;
    window._replyEditing = null;
    refreshOrderCard(id);
  } catch(e) { alert('오류: '+e.message); }
}

async function saveReply(id) {
  var input = document.getElementById('reply-input-'+id);
  if (!input) return;
  var val = input.value.trim();
  var o = allOrders.find(function(x){return x.id===id;}); if(!o) return;
  try {
    await db.collection('orders_request').doc(id).update({
      reply: val,
      replyTs: firebase.firestore.FieldValue.serverTimestamp()
    });
    o.reply = val;
    window._replyEditing = null;
    refreshOrderCard(id);
  } catch(e) { alert('오류: '+e.message); }
}

function refreshOrderCard(id) {
  // 카드 하나만 다시 그려서 전체 목록 리렌더 없이 갱신
  var el = document.getElementById('ocard_'+id);
  if (el) {
    var o = allOrders.find(function(x){return x.id===id;});
    if (o) {
      var tmp = document.createElement('div');
      tmp.innerHTML = renderCard(o);
      el.parentNode.replaceChild(tmp.firstChild, el);
    }
  } else {
    renderOrders(); // 못 찾으면 전체 다시 그리기로 안전하게 처리
  }
}

var exportInProgress = {}; // 같은 주문 버튼 빠르게 연타할 때 동시처리(레이스 컨디션) 방지

function updateExportDate(id, val) {
  var o = allOrders.find(function(x){return x.id===id;});
  if (o) o.exportDate = val;
  db.collection('orders_request').doc(id).update({exportDate: val}).catch(function(e){ console.error('배송일 저장 실패:', e.message); });
}

async function exportToOrder(id) {
  if (exportInProgress[id]) return; // 이미 처리 중이면 중복 클릭 무시
  var o = allOrders.find(function(x){return x.id===id;}); if(!o) return;

  // 거래처명 해석: 정확히 일치 → 그대로 / 90%+ 유사 → 자동 매핑 / 그 외 → 확인 필요
  var resolved = resolveClientName(o.client);
  var resolvedClient = resolved.name;

  if (!resolvedClient) {
    if(!confirm('⚠️ "'+o.client+'"은 거래처 관리에 등록되지 않은 이름입니다.\n\n정식 거래처명과 다를 경우 출고지시서에 같은 거래처가 다른 이름으로 중복 생성될 수 있습니다.\n\n그래도 이 이름으로 등록하시겠습니까?\n(취소 후 거래처 관리에서 정식 이름을 확인해 주세요)')) return;
    resolvedClient = o.client; // 그대로 등록하기로 확인한 경우
  } else if (resolved.autoMapped) {
    // 90%+ 유사도로 자동 매핑된 경우는 별도 확인창 없이 진행 (등록된 정식 이름으로 저장)
  }

  // 날짜 결정: 관리자가 배송일 입력란에서 지정한 날짜 우선, 없으면 접수 시각 날짜로 대체
  var t = o.ts&&o.ts.toDate?o.ts.toDate():new Date();
  var dateInputEl = document.getElementById('edate_'+id);
  var dateStr = (dateInputEl && dateInputEl.value) || o.exportDate || (t.getFullYear()+'-'+(t.getMonth()+1).toString().padStart(2,'0')+'-'+t.getDate().toString().padStart(2,'0'));
  
  // 거래처 담당기사 찾기 (정식 거래처명 기준)
  var driver = clients[resolvedClient] || '';

  // 출고지시서 items 형태로 변환 (item에는 driver 불필요 - 거래처 레벨에만 저장)
  // 단위(unit)는 발주 당시 저장된 스냅샷을 그대로 믿지 않고, 지금 제품관리 화면의 실제 단위로 덮어씀
  // (제품 단위를 나중에 고쳐도 이미 들어온 주문엔 옛날 값이 그대로 남아있어서 "봉"이 계속 재발하던 문제)
  await loadProdCatMap();
  var newItems = (o.items||[]).map(function(item){
    return { pid: item.pid, pname: item.pname||'', qty: item.qty, unit: prodUnitMap[item.pid] || item.unit || '판', scanned: 0, done: false };
  });

  exportInProgress[id] = true;
  try {
    var ordRef = db.collection('orders').doc(dateStr);
    var existingDoc = await ordRef.get();
    var existingClientData = existingDoc.exists ? (existingDoc.data()||{})[resolvedClient] : null;
    var existingItems = (existingClientData && existingClientData.items) || [];
    // 거래처별로, 어떤 주문(id)이 이미 몇 개씩 반영했는지 기록해둔 것 (재등록 중복합산 방지용)
    var orderContributions = Object.assign({}, (existingClientData && existingClientData.orderContributions) || {});
    var prevContribution = orderContributions[id]; // 이 주문이 예전에 반영한 수량 (있으면 = 재등록 케이스)

    var mergedMap = {};
    existingItems.forEach(function(item){ mergedMap[item.pid] = Object.assign({}, item); });

    // 특이사항(메모)도 주문별로 추적 - 여러 주문이 합쳐져도 각자 메모가 안 사라지고, 재등록해도 중복되지 않게
    var orderMemos = Object.assign({}, (existingClientData && existingClientData.orderMemos) || {});

    if (prevContribution) {
      // 재등록: 이 주문이 예전에 더했던 수량을 먼저 되돌려서, 아래서 새 수량을 더해도 중복 합산되지 않게 함
      prevContribution.forEach(function(p){
        if (mergedMap[p.pid]) {
          mergedMap[p.pid].qty = (mergedMap[p.pid].qty||0) - (p.qty||0);
        }
      });
    }
    // 이미 등록된 다른 항목이 있어도 항상 합쳐서 반영합니다 (기존 항목은 절대 지우지 않음)

    // 이번 주문 내용 더하기 (재등록이면 위에서 뺀 다음 여기서 새로 더해지므로 결과적으로 "교체"가 됨)
    newItems.forEach(function(item){
      if (mergedMap[item.pid]) {
        var wasDone = mergedMap[item.pid].done, prevScanned = mergedMap[item.pid].scanned||0;
        mergedMap[item.pid].qty = (mergedMap[item.pid].qty||0) + (item.qty||0);
        if (wasDone && prevScanned < mergedMap[item.pid].qty) mergedMap[item.pid].done = false;
      } else {
        mergedMap[item.pid] = Object.assign({}, item);
      }
    });

    // 수량이 0 이하로 떨어진 항목은 정리 (재등록 과정에서 빼고 다시 더했는데 0이 된 경우)
    var finalItems = Object.keys(mergedMap).map(function(k){ return mergedMap[k]; }).filter(function(it){ return (it.qty||0) > 0; });
    // 같은 품목군(분류)끼리 자동으로 묶어서 정렬
    await loadProdCatMap();
    finalItems = groupItemsByCat(finalItems);

    // 이 주문이 이번에 반영한 수량을 기록 (다음에 또 재등록할 때 이 값을 빼고 다시 더함)
    orderContributions[id] = newItems.map(function(it){ return {pid: it.pid, qty: it.qty}; });

    // 이 주문의 특이사항(메모) 기록 (재등록하면 같은 키라서 교체될 뿐 중복되지 않음)
    if (o.memo) { orderMemos[id] = o.memo; } else { delete orderMemos[id]; }
    // 같은 거래처/날짜에 여러 주문이 합쳐진 경우, 각 주문의 메모를 줄바꿈으로 모두 보여줌
    var combinedMemo = Object.keys(orderMemos).map(function(k){ return orderMemos[k]; }).filter(Boolean).join('\n');

    // 출고지시서에 해당 거래처만 추가/덮어쓰기 (merge:true로 다른 거래처 데이터 보호)
    // 정식 거래처명(resolvedClient)을 키로 사용 - 자동매핑된 경우 원래 표기와 달라도 정식명으로 통일 저장
    await ordRef.set({ [resolvedClient]: { items: finalItems, driver: driver, orderContributions: orderContributions, orderMemos: orderMemos, memo: combinedMemo } }, { merge: true });

    // 발주 상태를 exported로 업데이트
    await db.collection('orders_request').doc(id).update({status:'exported'});
    var ord = allOrders.find(function(x){return x.id===id;});
    if(ord) ord.status='exported';


    updateStats(); renderOrders();
    var mappedNote = resolved.autoMapped ? ('\n("'+o.client+'" → "'+resolvedClient+'"로 자동 연동됨, 유사도 '+Math.round(resolved.score*100)+'%)') : '';
    alert('✅ 출고지시서에 등록됐어요!\n\n거래처: '+resolvedClient+mappedNote+'\n날짜: '+dateStr+'\n\n출고관리 시스템에서 확인해보세요!');
  } catch(e) {
    alert('오류: '+e.message);
  } finally {
    exportInProgress[id] = false;
  }
}

async function confirmOrder(id) {
  try {
    await db.collection('orders_request').doc(id).update({status:'confirmed'});
    var o = allOrders.find(function(x){return x.id===id;});
    if(o) o.status='confirmed';
    updateStats(); renderOrders();
  } catch(e){ alert('확인 처리 오류: '+e.message); }
}

async function cancelOrder(id) {
  if(!confirm('취소하시겠어요?')) return;
  try {
    await db.collection('orders_request').doc(id).update({status:'cancelled'});
    var o = allOrders.find(function(x){return x.id===id;});
    if(o) o.status='cancelled';
    updateStats(); renderOrders();
  } catch(e){ alert('취소 처리 오류: '+e.message); }
}

function printOrder(id) {
  var o = allOrders.find(function(x){return x.id===id;}); if(!o) return;
  var t = o.ts&&o.ts.toDate?o.ts.toDate():new Date();
  var dateStr = t.getFullYear()+'-'+(t.getMonth()+1).toString().padStart(2,'0')+'-'+t.getDate().toString().padStart(2,'0');
  var total = (o.items||[]).reduce(function(s,i){return s+i.qty;},0);
  var w = window.open('','_blank');
  w.document.write('<html><head><meta charset="UTF-8"><style>body{font-family:Malgun Gothic,sans-serif;padding:20px;}h2{margin-bottom:4px;}p{color:#888;font-size:13px;margin-bottom:16px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ccc;padding:6px 10px;}th{background:#f0f0f0;}</style></head><body>'+
    '<h2>🥐 발주서 — '+escapeHtml(o.client)+'</h2><p>'+dateStr+' | 총 '+(o.items||[]).length+'개 품목, '+total+'개</p>'+
    '<table><thead><tr><th>품목명</th><th>수량</th></tr></thead><tbody>'+
    (o.items||[]).map(function(item){return '<tr><td>'+escapeHtml(item.pname)+'</td><td style="text-align:center;">'+item.qty+'개</td></tr>';}).join('')+
    '</tbody></table>'+(o.memo?'<p style="margin-top:12px;">요청사항: '+escapeHtml(o.memo)+'</p>':'')+
    '</body></html>');
  w.document.close();
  setTimeout(function(){w.print();},500);
}

loadOrders();

// 브라우저 알림 권한 요청 (페이지 로드 시 1회)
if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
  Notification.requestPermission();
}

// 짧은 알림음 재생 (외부 파일 없이 코드로 생성, 2번 삑삑)
function playNewOrderSound() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(startTime) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
      osc.start(startTime); osc.stop(startTime + 0.25);
    }
    beep(ctx.currentTime);
    beep(ctx.currentTime + 0.35);
  } catch(e) { console.error('알림음 재생 실패:', e.message); }
}

// 원래 탭 제목 저장 (새 발주 왔을 때 깜빡이게 하기 위해)
var _origTitle = document.title;
var _titleBlinkTimer = null;
function blinkTitle(msg) {
  if (_titleBlinkTimer) clearInterval(_titleBlinkTimer);
  var on = true;
  _titleBlinkTimer = setInterval(function(){
    document.title = on ? msg : _origTitle;
    on = !on;
  }, 1000);
  // 탭을 클릭(포커스)하면 깜빡임 멈추고 원래 제목으로
  window.addEventListener('focus', function stopBlink(){
    if (_titleBlinkTimer) { clearInterval(_titleBlinkTimer); _titleBlinkTimer = null; }
    document.title = _origTitle;
    window.removeEventListener('focus', stopBlink);
  });
}

// 실시간 발주 변경 감지 (신규 발주 추가 시 자동 새로고침 + 알림)
let _lastSnapCount = 0;
db.collection('orders_request')
  .onSnapshot(function(snap){
    if(_lastSnapCount !== 0 && snap.size > _lastSnapCount) {
      var newCount = snap.size - _lastSnapCount;
      loadOrders();
      playNewOrderSound();
      blinkTitle('🔔 새 발주 ' + newCount + '건!');
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        try {
          new Notification('🔔 새 발주 도착', { body: newCount + '건의 새 발주가 등록됐어요.' });
        } catch(e) {}
      }
    } else if (_lastSnapCount !== 0 && snap.size !== _lastSnapCount) {
      loadOrders();
    }
    _lastSnapCount = snap.size;
  });

// 실시간 요청사항(거래처 댓글) 감지 - 미확인 배지 + 알림
let _reqLastCount = 0;
db.collection('client_messages').where('from','==','client').where('readByAdmin','==',false)
  .onSnapshot(function(snap){
    var badge = document.getElementById('request-total-badge');
    if(badge) badge.innerHTML = snap.size > 0 ? '<span class="bell-blink">🔔'+snap.size+'</span>' : '';
    if(_reqLastCount !== 0 && snap.size > _reqLastCount){
      playNewOrderSound();
      blinkTitle('💬 새 요청사항!');
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        try { new Notification('💬 새 요청사항 도착', { body: '거래처로부터 새 메시지가 있어요.' }); } catch(e) {}
      }
    }
    _reqLastCount = snap.size;
    // 요청사항 패널이 열려있으면 목록도 갱신
    if (document.getElementById('request-panel').style.display !== 'none') loadRequestClients();
  });
</script>
